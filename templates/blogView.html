<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=1.0, user-scalable=yes">
    <title>归档</title>
</head>

<link href="/static/css/rg_base.css?ver={{css_ver}}" rel="stylesheet" type="text/css" id="rg_base">
<link href="/static/css/rg-btn.css?ver={{css_ver}}" rel="stylesheet" type="text/css">
<link href="/static/css/rg_config.css?ver={{css_ver}}" rel="stylesheet" type="text/css" id="rg_config">
<link href="/static/css/photos.css?ver={{css_ver}}" rel="stylesheet" type="text/css">
<link href="/static/css/timeline.css?ver={{css_ver}}" rel="stylesheet" type="text/css">
<link rel="stylesheet" type="text/css" href="/static/css/groupModal.css?ver={{css_ver}}" />

<style>
    /* ===== 归档页：分类选择器（其余卡片/时间轴样式见 timeline.css） ===== */
    .privacyWrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        height: auto;
        margin-top: 10px;
        margin-left: 4px !important;
        padding-bottom: 4px;
        font-size: 13px;
        color: #888;
    }
    .groupButton {
        font-weight: 500;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 13px;
        color: #696969;
        background: rgba(105, 105, 105, 0.10);
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
    }
    .groupButton:hover {
        color: #696969;
        background: rgba(105, 105, 105, 0.18);
    }
</style>
<body>

<div class="wrapperBg wrapperPadding">
    <div class="privacyWrapper" style="margin-top: 10px; margin-left: 10px">
        日志分类 :
        <div id="groupNameButton" class="groupButton">全部分类</div>
    </div>

    <div class="wrapperLR" style="padding-bottom: 160px;">
        <div class="timeline" style="margin-top: 10px">
            <ul id="timeLineYearWrapper" class="year"></ul>
        </div>
        <div style="width: 100%">
            <div id="artCollectionView" class="collectionView"></div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // 以下函数暴露为全局（动态生成的 HTML onclick 需要调用）
    // - goto_blog, loadArt, loadTimeLine

    var timezone = rg_getTimezone();

    preventEnterEnable(true, function() { return true; });

    $(function() {
        initGroupModal(null, 'groupNameButton', '全部分类', that.relation < 0,
            function(id, name, level) {
                $('#groupNameButton').text(name);
                loadTimeLine(id);
            }, function(group) {
                $('#groupNameButton').text(group.name);
            });
        loadTimeLine(null);
    });

    window.loadTimeLine = function(groupId) {
        $.ajax({
            type: 'GET',
            url: '/blog/month/view',
            data: {
                user_id: that.userId,
                timezone: timezone,
                group_id: groupId
            },
            success: function(result) {
                if (result.code !== 1000) { alert('加载失败'); return; }
                var data = result.data;
                if (!data.length) data = [{count: 0, months: (new Date()).Format('yyyy-MM')}];

                var years = [];
                var lastYear = null;
                for (var i = 0; i < data.length; i++) {
                    var monthView = data[i];
                    var month = monthView.months;
                    var year = month.split('-')[0];
                    if (lastYear !== year) {
                        years.push({ year: year, count: 0, months: [] });
                        lastYear = year;
                    }
                    var cur = years[years.length - 1];
                    cur.months.push(monthView);
                    cur.count += monthView.count;
                }
                drawMonths(years);
            },
            error: function(e) { alert(e.errorText); }
        });
    };

    function drawMonths(data) {
        var htmlString = '';
        var firstMonth = true;

        for (var i = 0; i < data.length; i++) {
            var year = data[i];
            var monthString = '';
            var isActiveYear = (i === 0);

            for (var j = 0; j < year.months.length; j++) {
                var month = year.months[j];
                var monthNumber = month.months.split('-')[1];
                var countStr = month.count < 10 ? '0' + month.count : '' + month.count;
                var isActiveMonth = (firstMonth);

                monthString += '<li class="' + (isActiveMonth ? 'active' : '')
                    + '" name="' + month.months + '"><a>' + monthNumber + '月(' + countStr + ')</a></li>';

                if (firstMonth) loadArt(year.year, monthNumber);
                firstMonth = false;
            }

            htmlString += '<li class="' + (isActiveYear ? 'active' : '') + '">'
                + '<div class="year-button">' + year.year + ' (' + (year.count < 10 ? '0' + year.count : year.count) + ')</div>'
                + '<ul class="month">' + monthString + '</ul></li>';
        }

        $('#timeLineYearWrapper').html(htmlString);
        configTimeLineClick();
        if (!data.length) $('#artCollectionView').html('');
    }

    function configTimeLineClick() {
        $('.year:not(:first)').find('.month').hide();

        $('.year>li').click(function() {
            $('li.active', $(this).parent()).removeClass('active');
            $(this).addClass('active');
            var $firstUl = $('ul>li:first', this);
            $firstUl.addClass('active');
            var name = $firstUl[0].attributes.name.value.split('-');
            loadArt(name[0], name[1]);
        });

        $('.month>li').click(function() {
            var $ul = $(this).parent();
            $ul.find('.active').removeClass('active');
            $(this).addClass('active');
            var name = this.attributes.name.value.split('-');
            loadArt(name[0], name[1]);
            return false;
        });
    }

    window.loadArt = function(year, month) {
        $.ajax({
            type: 'GET',
            url: '/blog/month/list',
            data: {
                user_id: that.userId,
                timezone: timezone,
                year: year,
                month: month,
                group_id: groupSelf.modal_selected_groupId
            },
            success: function(result) {
                if (result.code !== 1000) { alert('加载失败'); return; }
                var arts = result.data;
                var artsHTML = '';
                var params = {applySF: true, side: 80, quality: 'low'};

                for (var i = 0; i < arts.length; i++) {
                    var art = arts[i];
                    var addDate = new Date(art.addtime);
                    var time = addDate.Format('MM-dd');
                    var title = art.title || addDate.Format('yyyy MM-dd');

                    artsHTML +=
                        '<div class="collectionCell collectionWrap wrapperItemBg" style="margin: 10px;padding: 0; height: unset" hoverTitle="' + time + '">'
                        + '<div onclick="goto_blog(this)" id="' + art.id + '" class="bgNoRepeatImage" '
                        + 'style="background-image: url(' + (art.cover ? art.cover.my_cover(params) : '') + ');">'
                        + '<div class="bgNoRepeatImage" style="float: left; background-color: rgba(255,255,255,0.82);">'
                        + '<div class="auto_text articleTitle two_line">' + title.encodeHtml() + '</div>'
                        + '<div class="auto_text ' + (art.cover ? 'three_line' : 'preview_text_many') + '">' + art.summary.encodeHtml() + '</div>'
                        + '</div></div></div>';
                }
                $('#artCollectionView').html(artsHTML);
            },
            error: function(e) { alert(e.errorText); }
        });
    };

    window.goto_blog = function(e) {
        window.open('/blog/art/' + e.id);
    };

    function setMinHeight() {
        $('#blogViewContent').css('minHeight', (scH * 0.6) + 'px');
    }
    setMinHeight();
    $(window).resize(setMinHeight);
})();
</script>
</body>
</html>
