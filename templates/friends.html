<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=1.0, user-scalable=yes"/>
    <title>我的好友</title>
</head>
<link href="/static/css/rg_base.css?ver={{css_ver}}" rel="stylesheet" type="text/css" id="rg_base">
<link href="/static/css/rg-btn.css?ver={{css_ver}}" rel="stylesheet" type="text/css">
<link href="/static/css/rg_config.css?ver={{css_ver}}" rel="stylesheet" type="text/css" id="rg_config">
<link href="/static/css/pagination.css?ver={{css_ver}}" rel="stylesheet" type="text/css">
<script type="text/javascript" src="/static/js/pagination.js?ver={{js_ver}}"></script>
<body>

<div id="friendsApp" class="wrapperLR {{ 'wrapperPadding' if count > 0 }} wrapperBg">
    <div class="wrapperFull">

        <div v-for="item in list" class="wrapperItem wrapperItemBg">
            <div class="wrapperLR wrapperXYCenter">
                <div class="wrapperFlex" style="padding-right: 20px">
                    <div class="rgIcon rgHover" @click="gotoBlog(item.ID)"
                         :style="iconStyle(item.icon)"
                         style="width: 58px;"></div>
                </div>
                <div class="wrapperFull">
                    <div class="articleTitle auto_text" @click="gotoBlog(item.ID)">
                        [[ item.nickname ]]
                    </div>
                    <div class="auto_text artSubTitle">
                        [[ item.title || item.desc ]]
                    </div>
                    <div class="auto_text artSubTitle secondTextColor">
                        添加时间: [[ formatDate(item.follow_time) ]]
                    </div>
                </div>
                <div class="wrapperFlex rgButton" @click="doUnfollow(item.ID)">
                    移除
                </div>
            </div>
        </div>

        <div v-if="list.length === 0" class="nothing">
            <a style="background-color: rgba(255,255,255,0.6);">暂时没有好友</a>
        </div>
        <div v-else class="ht-page" ref="pagination"></div>
    </div>
</div>

<script>
(function() {
    'use strict';

    new Vue({
        el: '#friendsApp',
        delimiters: ['[[', ']]'],
        data: {
            list: {{ list|tojson }},
            count: {{ count }},
            nowPage: {{ nowPage }},
            pageSize: {{ pageSize }}
        },
        mounted: function() {
            var self = this;
            var $pag = $(self.$refs.pagination);
            Pagination.init($pag, function(i) {
                rgLoadContent('/user/friends?page=' + (i + 1));
            });
            Pagination.Page($pag, self.nowPage - 1, self.count, self.pageSize);
            Pagination.bindListener($pag, function() {
                $('html,body').animate({scrollTop: $('.toolBarWrapper').offset().top - 60}, 0);
            }, false);
        },
        methods: {
            gotoBlog: function(id) {
                window.open('/blog/' + id);
            },
            doUnfollow: function(id) {
                if (!confirm('确定移除此好友')) return;
                var self = this;
                $.ajax({
                    type: 'POST',
                    dataType: 'json',
                    url: '/user/unfollow',
                    data: { id: id },
                    success: function(result) {
                        if (result.code === 1000) {
                            rgLoadContent('/user/friends?page=' + self.nowPage);
                        }
                    }
                });
            },
            iconStyle: function(icon) {
                return icon ? { backgroundImage: 'url("' + icon + '")' } : {};
            },
            formatDate: function(ts) {
                return new Date(parseInt(ts)).Format('yyyy-MM-dd hh:mm:ss');
            }
        }
    });
})();
</script>
</body>
</html>
